# Reference nginx site for Pinksheet.
#
# Exposes ONLY POST /webhooks/square.php to the public internet (Square's
# webhook, HMAC-verified by the app). Everything else requires basic auth.
#
# Place in /etc/nginx/sites-available/pinksheet, symlink to sites-enabled,
# then:
#   apt-get install -y nginx apache2-utils
#   htpasswd -c /etc/nginx/.htpasswd dispo
#   certbot --nginx -d your-domain.com    (or your TLS setup)
#   systemctl reload nginx
#
# Square delivers only to HTTPS, and SQUARE_WEBHOOK_NOTIFICATION_URL must
# exactly equal the public URL below (scheme + host + path).

server {
    listen 80;
    server_name your-domain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;

    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # Square webhook — no basic auth (Square cannot authenticate), the app
    # verifies the HMAC signature itself.
    location = /webhooks/square.php {
        limit_except POST { deny all; }
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 1m;
    }

    # The rest of the app — protected, LAN/operator access only.
    location / {
        auth_basic "Pinksheet";
        auth_basic_user_file /etc/nginx/.htpasswd;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 128m;
    }
}
